<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Login — CareMatch</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container custom-card hero fade-in">
    <div class="login-box">
      <h1>Welcome back</h1>
      <p>Log in to manage requests or hire a caretaker.</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="sr-only">Email address</label>
          <input required type="email" id="email" name="email" placeholder="Email address" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password" class="sr-only">Password</label>
          <input required type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="submit" class="primary">Log in</button>
        <p class="text-center mt-4">
          <a href="signup.html" class="text-blue-400 hover:text-blue-300">Don't have an account? Sign up</a>
        </p>
      </form>
    </div>
  </div>
  <div class="toast"></div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
