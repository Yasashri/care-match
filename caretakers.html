<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Browse Caretakers — CareMatch</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/caretakers.css">
</head>
<body>
  <div class="container hero fade-in">
    <div>
      <h1>Browse & filter caretakers</h1>
      <p>Search by area, experience and rating. Click any card to see a detailed profile and hire.</p>
      <div class="searchbar">
        <input id="q" placeholder="Search location, skills, or languages..." aria-label="Search" />
        <div class="filters">
          <div class="filter-group">
            <select id="minRating" aria-label="Minimum Rating">
              <option value="0">Any rating</option>
              <option value="4">4★ and up</option>
              <option value="4.5">4.5★ and up</option>
            </select>
            <select id="minExp" aria-label="Minimum Experience">
              <option value="0">Any experience</option>
              <option value="3">3+ years</option>
              <option value="5">5+ years</option>
            </select>
          </div>
          <button class="primary" id="filterBtn">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            Search
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="container" id="results-info" style="display: none">
    <p class="muted" style="text-align: center; margin: 0.5rem 0">
      Showing <span id="results-count">0</span> caretakers
    </p>
  </div>
  <div class="container grid cards" id="list">
    <!-- Loading placeholders -->
    <div class="card card-placeholder" aria-hidden="true"></div>
    <div class="card card-placeholder" aria-hidden="true"></div>
    <div class="card card-placeholder" aria-hidden="true"></div>
  </div>

  <div class="toast"></div>
  <script src="js/data.caretakers.js"></script>
  <script src="js/common.js"></script>
  <script src="js/caretakers.js"></script>
</body>
</html>
